<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The personal homepage of Suozhao Ji."
    />
    <meta name="theme-color" content="#f3f0e8" />
    <title>Suozhao Ji</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Personal Homepage</p>
        <h1 id="page-title">Suozhao Ji</h1>
      </header>

      <section class="education" aria-labelledby="education-title">
        <div class="section-heading">
          <p class="section-number" aria-hidden="true">01</p>
          <h2 id="education-title">Education</h2>
        </div>

        <div class="education-list">
          <article class="education-item">
            <div>
              <h3>Beihang University</h3>
              <p>Bachelor&rsquo;s Degree</p>
            </div>
            <p class="dates">
              <time datetime="2014-09">Sep 2014</time>
              <span aria-hidden="true">&mdash;</span>
              <time datetime="2018-06">Jun 2018</time>
            </p>
          </article>

          <article class="education-item">
            <div>
              <h3>Beihang University</h3>
              <p>Master&rsquo;s Degree</p>
            </div>
            <p class="dates">
              <time datetime="2018-09">Sep 2018</time>
              <span aria-hidden="true">&mdash;</span>
              <time datetime="2021-01">Jan 2021</time>
            </p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
